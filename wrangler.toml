name = "keyradar-th"
main = "worker/index.ts"
compatibility_date = "2026-08-02"

[assets]
directory = "./build"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "keyradar-th-prod"
# Not created yet. Run `pnpm wrangler login` then
# `pnpm wrangler d1 create keyradar-th-prod --location=apac`
# and paste the returned database_id here before any remote migrate/seed/deploy.
database_id = "REPLACE_WITH_REAL_DATABASE_ID"
migrations_dir = "drizzle"
