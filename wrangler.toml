name = "keyradar-th"
main = "worker/index.ts"
compatibility_date = "2026-08-02"

[assets]
directory = "./build"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "KV"
# keyradar_th
id = "1194bfe67e6f46abbafb29ac4c2a640a"
# keyradar_preview — only used by `wrangler dev --remote`; local dev uses Miniflare.
preview_id = "cf4e53ab817448ca8f32a16f98636871"

# 08:00 / 16:00 / 24:00 เวลาไทย (UTC+7)
[triggers]
crons = ["0 1,9,17 * * *"]

[observability]
enabled = true
