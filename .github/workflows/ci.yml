name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Regenerates worker-configuration.d.ts (gitignored) so `check:worker`
      # has the Cloudflare runtime + binding types available.
      - name: Generate Worker types
        run: pnpm wrangler types

      - name: Type check (app)
        run: pnpm check

      - name: Type check (worker)
        run: pnpm check:worker

      - name: Unit tests
        run: pnpm test

      - name: API route tests
        run: pnpm test:api

      # Applies migrations, seeds, asserts joins/chronology/idempotency.
      - name: D1 integration tests
        run: pnpm test:d1

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (mock mode)
        run: pnpm test:e2e

      - name: E2E tests (API mode, wrangler dev + local D1)
        run: pnpm test:e2e:api

      - name: Build
        run: pnpm build

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
