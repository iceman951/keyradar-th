<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-95162a03-9854-4dfd-88ea-ddfb17d8311d/styles.css">
<style>:root{--ok:oklch(0.80 0.135 158);--ok-dim:oklch(0.345 0.055 158);--ink:#e9e9ed;--mute:color-mix(in srgb,#e9e9ed 55%,transparent);--mute2:color-mix(in srgb,#e9e9ed 38%,transparent);--line:color-mix(in srgb,#e9e9ed 12%,transparent);--line2:color-mix(in srgb,#e9e9ed 7%,transparent)}body{margin:0;font-family:"Inter","Anuphan","Noto Sans Thai",system-ui,sans-serif;background:#161826;color:var(--ink)}a{color:#9184d9}a:hover{color:#b5abfc}</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:13px;padding:15px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(170deg,rgba(233,233,237,.035),rgba(233,233,237,.01));height:100%">
<div style="display:flex;align-items:center;gap:12px">
<span style="{{ s.logo }}">{{ s.letters }}</span>
<span style="display:flex;flex-direction:column;gap:4px;min-width:0">
<span style="font-size:15.5px;font-weight:600;letter-spacing:-0.01em">{{ s.name }}</span>
<span style="{{ s.typeStyle }}">{{ s.typeLabel }}</span>
</span>
</div>
<div style="display:flex;flex-direction:column;gap:7px">
<sc-for list="{{ s.rows }}" as="r" hint-placeholder-count="4">
<div style="{{ r.style }}"><span style="color:var(--mute);white-space:nowrap">{{ r.k }}</span><span style="{{ r.vStyle }}">{{ r.v }}</span></div>
</sc-for>
</div>
<p style="margin:0;font-size:11.5px;line-height:1.65;color:var(--mute2);flex:1">{{ s.note }}</p>
<a href="#" onClick="{{ s.go }}" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:13px;font-weight:500;text-decoration:none" style-hover="border-color:color-mix(in srgb,#9184d9 46%,transparent);background:color-mix(in srgb,#9184d9 9%,transparent);text-decoration:none">ดูดีลจากร้านนี้
<svg width="13" height="13" viewBox="0 0 256 256" fill="currentColor"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"></path></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:320},&quot;s&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any&quot;}}"></script>
</body>
</html>
