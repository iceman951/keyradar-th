<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-95162a03-9854-4dfd-88ea-ddfb17d8311d/styles.css">
<style>:root{--ok:oklch(0.80 0.135 158);--ok-dim:oklch(0.345 0.055 158);--ok-line:oklch(0.46 0.075 158);--warn:oklch(0.845 0.135 82);--warn-dim:oklch(0.345 0.055 74);--ink:#e9e9ed;--mute:color-mix(in srgb,#e9e9ed 55%,transparent);--mute2:color-mix(in srgb,#e9e9ed 38%,transparent);--line:color-mix(in srgb,#e9e9ed 12%,transparent);--line2:color-mix(in srgb,#e9e9ed 7%,transparent)}body{margin:0;font-family:"Inter","Anuphan","Noto Sans Thai",system-ui,sans-serif;background:#161826;color:var(--ink)}a{color:#9184d9}a:hover{color:#b5abfc}</style>
</helmet>
<a href="#" onClick="{{ g.go }}" style="display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:linear-gradient(170deg,rgba(233,233,237,.04),rgba(233,233,237,.012));text-decoration:none;color:var(--ink);height:100%" style-hover="border-color:color-mix(in srgb,#9184d9 46%,transparent);text-decoration:none">
<div style="position:relative">
<div style="{{ g.cover }}"><span style="{{ g.coverText }}">{{ g.title }}</span></div>
<sc-if value="{{ g.hasDisc }}">
<span style="position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:7px;background:rgba(9,11,18,.78);backdrop-filter:blur(6px);color:var(--ok);font-size:11.5px;font-weight:700;letter-spacing:.02em">−{{ g.disc }}%</span>
</sc-if>
<span style="position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:6px;background:rgba(9,11,18,.72);backdrop-filter:blur(6px);font-size:9px;font-weight:700;letter-spacing:.08em;color:#cfd3e5">
<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-9.94 9.02l5.3 2.19a2.83 2.83 0 011.6-.49h.14l2.36-3.42v-.05a3.78 3.78 0 113.78 3.78h-.09l-3.37 2.4v.12a2.84 2.84 0 01-5.63.5l-3.79-1.57A10 10 0 1012 2z"></path></svg>STEAM</span>
</div>
<div style="display:flex;flex-direction:column;gap:9px;padding:11px 12px 12px;flex:1">
<div style="display:flex;flex-direction:column;gap:5px;min-width:0">
<span style="font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">{{ g.title }}</span>
<span style="{{ g.thStyle }}">
<svg width="10" height="10" viewBox="0 0 256 256" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg>{{ g.thLabel }}</span>
</div>
<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:auto">
<span style="font-size:21px;font-weight:700;color:var(--ok);letter-spacing:-0.025em;line-height:1">{{ g.finalText }}</span>
<s style="font-size:12px;color:var(--mute2)">{{ g.steamText }}</s>
</div>
<div style="display:flex;align-items:center;gap:8px;min-width:0">
<span style="{{ g.logo }}">{{ g.letters }}</span>
<span style="display:flex;flex-direction:column;gap:2px;min-width:0">
<span style="font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ g.store }}</span>
<span style="{{ g.typeStyle }}">{{ g.storeTypeLabel }}</span>
</span>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:9px;border-top:1px solid var(--line2)">
<span style="font-size:11px;color:var(--mute2)">{{ g.storesText }}</span>
<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--color-accent)">เปรียบเทียบราคา
<svg width="12" height="12" viewBox="0 0 256 256" fill="currentColor"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"></path></svg></span>
</div>
</div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:300},&quot;g&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}"></script>
</body>
</html>
