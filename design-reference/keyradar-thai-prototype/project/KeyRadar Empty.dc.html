<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-95162a03-9854-4dfd-88ea-ddfb17d8311d/styles.css">
<style>:root{--ok:oklch(0.80 0.135 158);--ok-dim:oklch(0.345 0.055 158);--warn:oklch(0.845 0.135 82);--warn-dim:oklch(0.345 0.055 74);--warn-line:oklch(0.46 0.075 74);--bad:oklch(0.72 0.155 24);--bad-dim:oklch(0.335 0.070 24);--bad-line:oklch(0.45 0.095 24);--ink:#e9e9ed;--mute:color-mix(in srgb,#e9e9ed 55%,transparent);--mute2:color-mix(in srgb,#e9e9ed 38%,transparent);--line:color-mix(in srgb,#e9e9ed 12%,transparent)}body{margin:0;font-family:"Inter","Anuphan","Noto Sans Thai",system-ui,sans-serif;background:#161826;color:var(--ink)}a{color:#9184d9}a:hover{color:#b5abfc}</style>
</helmet>
<div style="{{ box }}">
<div style="{{ iconWrap }}">{{ icon }}</div>
<h3 style="font-size:18px;font-weight:600;letter-spacing:-0.02em;margin:0;text-wrap:balance">{{ title }}</h3>
<p style="margin:0;font-size:13px;line-height:1.7;color:var(--mute);max-width:440px;text-wrap:pretty">{{ body }}</p>
<sc-if value="{{ tips }}">
<div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:2px">
<sc-for list="{{ tips }}" as="t" hint-placeholder-count="3">
<span style="padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;color:var(--mute)">{{ t.label }}</span>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ cta }}">
<button onClick="{{ onAction }}" style="{{ ctaStyle }}">{{ cta }}</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:620,&quot;height&quot;:320},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;no-results&quot;,&quot;no-th&quot;,&quot;no-price&quot;,&quot;no-deals&quot;,&quot;store-down&quot;],&quot;default&quot;:&quot;no-results&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;q&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The Forest&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onAction&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const PH = { search: 'M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z', warning: 'M236.8,188.09,149.35,36.22h0a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09Zm-13.87,15.71a8.5,8.5,0,0,1-7.48,4.2H40.55a8.5,8.5,0,0,1-7.48-4.2,7.59,7.59,0,0,1,0-7.72L120.52,44.21a8.75,8.75,0,0,1,15,0l87.45,151.87A7.59,7.59,0,0,1,222.93,203.8ZM120,144V104a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,180Z', refresh: 'M240,56v48a8,8,0,0,1-8,8H184a8,8,0,0,1,0-16h28.69L184.32,71.63l-.4-.42a80,80,0,1,0-1.67,114.78,8,8,0,0,1,11,11.63A95.44,95.44,0,0,1,128,224h-1.32A96,96,0,1,1,195.75,60L224,86.05V56a8,8,0,1,1,16,0Z', chart: 'M224,200h-8V40a8,8,0,0,0-8-8H152a8,8,0,0,0-8,8V80H96a8,8,0,0,0-8,8v40H48a8,8,0,0,0-8,8v64H32a8,8,0,0,0,0,16H224a8,8,0,0,0,0-16ZM160,48h40V200H160ZM104,96h40V200H104ZM56,144H88v56H56Z' };
const ICON = (name, color) => React.createElement('svg', { width: 25, height: 25, viewBox: '0 0 256 256', fill: color }, React.createElement('path', { d: PH[name] }));

class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind || 'no-results';
    const q = this.props.q || '';
    const map = {
      'no-results': {
        tone: 'neutral', icon: ICON('search', '#9397ab'),
        title: q ? `ไม่พบเกมที่ตรงกับ “${q}”` : 'ไม่พบเกมที่ตรงกับคำค้นหา',
        body: 'ลองพิมพ์ชื่อเกมเป็นภาษาอังกฤษ ตัดคำต่อท้ายอย่าง Edition หรือ Bundle ออก หรือเลือกจากเกมยอดนิยมด้านล่าง',
        tips: ['Elden Ring', 'Valheim', 'Palworld'], cta: 'กลับไปหน้าแรก'
      },
      'no-th': {
        tone: 'bad', icon: ICON('warning', 'oklch(0.72 0.155 24)'),
        title: 'ยังไม่พบข้อเสนอที่ยืนยันว่าเปิดใช้งานในประเทศไทยได้',
        body: `ข้อเสนอทั้งหมดของ ${q} ที่เรารวบรวมได้ตอนนี้เป็นคีย์ล็อกภูมิภาคอื่น หรือผู้ขายยังไม่ได้ระบุภูมิภาคอย่างชัดเจน เราไม่แนะนำให้ซื้อจนกว่าจะตรวจสอบกับร้านค้าโดยตรง`,
        tips: null, cta: 'ดูข้อเสนอทั้งหมดพร้อมคำเตือน'
      },
      'no-price': {
        tone: 'warn', icon: ICON('refresh', 'oklch(0.845 0.135 82)'),
        title: 'ยังไม่มีข้อมูลราคาสำหรับเกมนี้',
        body: 'เรายังดึงราคาจากร้านค้าไม่สำเร็จ อาจเป็นเพราะร้านค้าปลายทางไม่ตอบสนองชั่วคราว ลองรีเฟรชอีกครั้งในอีกสักครู่',
        tips: null, cta: 'ลองดึงราคาอีกครั้ง'
      },
      'no-deals': {
        tone: 'neutral', icon: ICON('chart', '#9397ab'),
        title: 'ไม่มีดีลในหมวดนี้ตอนนี้',
        body: 'เงื่อนไขที่เลือกยังไม่ตรงกับดีลที่กำลังใช้งานอยู่ ลองเลือกหมวดอื่นหรือกลับไปดูดีลแนะนำ',
        tips: null, cta: 'ดูดีลแนะนำ'
      },
      'store-down': {
        tone: 'warn', icon: ICON('warning', 'oklch(0.845 0.135 82)'),
        title: 'ร้านค้านี้ไม่ตอบสนองชั่วคราว',
        body: 'เราไม่สามารถยืนยันราคาและสต็อกล่าสุดจากร้านนี้ได้ ราคาที่แสดงเป็นข้อมูลจากการดึงครั้งก่อน',
        tips: null, cta: 'ลองอีกครั้ง'
      }
    };
    const d = map[k] || map['no-results'];
    const tone = { neutral: { bg: '#2b2e3f', bd: '#3a3d52' }, warn: { bg: 'var(--warn-dim)', bd: 'var(--warn-line)' }, bad: { bg: 'var(--bad-dim)', bd: 'var(--bad-line)' } }[d.tone];
    return {
      icon: d.icon, title: d.title, body: d.body, cta: d.cta,
      tips: d.tips ? d.tips.map(t => ({ label: t })) : null,
      onAction: this.props.onAction || (e => { if (e) e.preventDefault(); }),
      box: { display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center', gap: 11, padding: '44px 22px', border: '1px dashed var(--line)', borderRadius: 16, background: 'color-mix(in srgb,#e9e9ed 2%,transparent)' },
      iconWrap: { display: 'grid', placeItems: 'center', width: 52, height: 52, borderRadius: 15, background: tone.bg, border: '1px solid ' + tone.bd, marginBottom: 3 },
      ctaStyle: { marginTop: 6, height: 42, padding: '0 20px', borderRadius: 11, border: '1px solid var(--color-accent)', background: 'color-mix(in srgb,#9184d9 13%,transparent)', color: 'var(--color-accent-200)', fontSize: 13.5, fontWeight: 600, cursor: 'pointer' }
    };
  }
}
</script>
</body>
</html>
